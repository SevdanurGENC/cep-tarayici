name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: android-tools-v1-${{ hashFiles('scripts/build-apk.sh') }}

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.HAS_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"

      - name: Build APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'cep' }}
        run: scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CepTarayici-apk
          path: dist/CepTarayici.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/CepTarayici.apk "dist/CepTarayici-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "dist/CepTarayici-${GITHUB_REF_NAME}.apk" \
            --title "Cep Tarayıcı ${GITHUB_REF_NAME}" --generate-notes
